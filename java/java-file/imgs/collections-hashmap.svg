<line x1="290" y1="255.0" x2="307" y2="255.0" stroke="#0CA678" stroke-width="1.6" marker-end="url(#aG)"/>
<rect x="460.0" y="243.0" width="130" height="24" rx="9" fill="#E6FCF5" stroke="#0CA678" stroke-width="1.8"/><text x="525" y="259.14" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#212529">K3 · V3</text>
