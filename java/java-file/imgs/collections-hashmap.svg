<line x1="239" y1="105" x2="274" y2="105" stroke="#ADB5BD" stroke-width="1.6" marker-end="url(#aM)"/>
<rect x="522.5" y="88.0" width="205" height="34" rx="9" fill="#FFF4E6" stroke="#F76707" stroke-width="1.8"/><text x="625" y="109.5" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">index = (n - 1) &amp; hash</text>
<line x1="484" y1="105" x2="519" y2="105" stroke="#ADB5BD" stroke-width="1.6" marker-end="url(#aM)"/>
<rect x="767.5" y="88.0" width="205" height="34" rx="9" fill="#E6FCF5" stroke="#0CA678" stroke-width="1.8"/><text x="870" y="109.5" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">table[index]</text>
<line x1="729" y1="105" x2="764" y2="105" stroke="#ADB5BD" stroke-width="1.6" marker-end="url(#aM)"/>
<text x="380" y="140" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#868E96">старшие биты → в младшие</text>
<text x="625" y="140" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#868E96">n — степень двойки: то же, что hash % n</text>
<text x="50" y="165" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#212529">Node[] table  (n = 16)</text>
