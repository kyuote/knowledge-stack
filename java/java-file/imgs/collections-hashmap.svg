<text x="340" y="349.0" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#212529">TreeNode — красно-чёрное дерево: O(log n)</text>
<text x="340" y="369.0" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#495057">treeify: &gt; 8 узлов в корзине и table ≥ 64</text>
<text x="340" y="387.0" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#495057">untreeify: ≤ 6 узлов → снова список</text>
