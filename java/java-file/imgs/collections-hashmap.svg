<text x="85" y="419.5" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#495057">…15</text>
<rect x="700" y="175" width="270" height="150" rx="12" fill="#EDF2FF" stroke="#4C6EF5" stroke-width="1.6"/>
<text x="716" y="200" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212529">По умолчанию</text>
<text x="716" y="222" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#212529">capacity 16 · loadFactor 0.75</text>
<text x="716" y="244" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#212529">threshold = 16 × 0.75 = 12</text>
<text x="716" y="266" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#212529">size &gt; threshold → resize ×2</text>
<text x="716" y="288" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#212529">узел из i → i или i + oldCap</text>
<text x="716" y="310" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#212529">(решает бит hash &amp; oldCap)</text>
<text x="716" y="350" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#868E96">get(k) == null ≠ «ключа нет» → containsKey</text>
