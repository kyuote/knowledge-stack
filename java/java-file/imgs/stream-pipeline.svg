<text x="40" y="262" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#495057"><tspan font-weight="700" fill="#212529">Поэлементно: </tspan>каждый элемент проходит всю цепочку, потом берётся следующий —</text>
<text x="40" y="284" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#495057" xml:space="preserve">1 → filter ✗    ·    2 → filter ✗    ·    3 → filter ✓ → map → 30 → toList    ·    4 → …</text>
