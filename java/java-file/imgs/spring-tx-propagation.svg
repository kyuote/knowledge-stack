<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
<defs><marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#868E96"/></marker><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E03131"/></marker><marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F76707"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0CA678"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4C6EF5"/></marker><marker id="aP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7048E8"/></marker></defs>
<rect x="1" y="1" width="998" height="398" rx="18" fill="#FCFCFD" stroke="#E9ECEF" stroke-width="2"/>
<text x="32" y="42" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#212529">Propagation: REQUIRED vs REQUIRES_NEW</text>
<text x="32" y="66" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#868E96">outer() с транзакцией вызывает inner() из другого бина</text>
<text x="32" y="110" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#212529">REQUIRED (по умолчанию)</text>
<rect x="40" y="126" width="900" height="34" rx="10" fill="#EDF2FF" stroke="#4C6EF5" stroke-width="1.8"/>
<text x="490.0" y="147.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">TX-1 · соединение #1</text>
<rect x="320" y="170" width="340" height="34" rx="10" fill="#EDF2FF" stroke="#4C6EF5" stroke-width="1.8"/>
<text x="490.0" y="191.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">inner() — работает в той же TX-1</text>
<text x="40" y="228" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#495057">inner() упал и пометил TX-1 rollback-only → откатится всё, даже если outer() поймал исключение (UnexpectedRollbackException)</text>
<text x="32" y="270" text-anchor="start" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#212529">REQUIRES_NEW</text>
<rect x="40" y="286" width="280" height="34" rx="10" fill="#EDF2FF" stroke="#4C6EF5" stroke-width="1.8"/>
<text x="180.0" y="307.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">TX-1 · соединение #1</text>
<rect x="320" y="286" width="340" height="34" rx="10" fill="#F1F3F5" stroke="#495057" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="490.0" y="307.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">TX-1 приостановлена</text>
<rect x="660" y="286" width="280" height="34" rx="10" fill="#EDF2FF" stroke="#4C6EF5" stroke-width="1.8"/>
<text x="800.0" y="307.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">TX-1 продолжается</text>
<rect x="320" y="330" width="340" height="34" rx="10" fill="#FFF4E6" stroke="#F76707" stroke-width="1.8"/>
<text x="490.0" y="351.375" text-anchor="middle" font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#212529">TX-2 · соединение #2 · свой commit</text>
<text x="40" y="386" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#495057">TX-2 фиксируется независимо (аудит, лог платежа). Но держит второе соединение — под нагрузкой можно исчерпать пул.</text>
</svg>